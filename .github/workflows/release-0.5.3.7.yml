name: Build 0.5.3.7 release package

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: macos-15-intel
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - name: Check out the release tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: v0.5.3.7
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          architecture: x64
      - name: Prepare dependencies
        run: |
          python3 -m pip install uv
          npm ci
          npm run configure
          node -e "require('electron')"
          electron_zip="$(find "$HOME/Library/Caches/electron" -name 'electron-v44.5.1-darwin-x64.zip' -print -quit)"
          test -n "$electron_zip"
          node -e 'const fs=require("fs"),c=require("crypto"),p=process.argv[1],h=c.createHash("sha256").update(fs.readFileSync(p)).digest("hex");if(h!==require("./node_modules/electron/checksums.json")[require("path").basename(p)])throw Error("Electron checksum mismatch")' "$electron_zip"
          echo "SUBSCRIBE_FLOW_ELECTRON_ZIP_DIR=$(dirname "$electron_zip")" >> "$GITHUB_ENV"
      - name: Build and verify the actual package
        run: npm run package:mac
      - name: Upload verified package to the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload v0.5.3.7 \
            dist/Subscribe-Flow-0.5.3.7-mac-x64.zip \
            dist/Subscribe-Flow-0.5.3.7-mac-x64.zip.sha256 --clobber
          cat dist/build-info.json
          cat docs/verification/v0.5.3.7-local/audit.json
          cat docs/verification/v0.5.3.7-local/result.json
